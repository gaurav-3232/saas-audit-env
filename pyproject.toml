[project]
name = "saas-audit-env"
version = "1.0.0"
description = "AI agent environment for SaaS subscription cost optimization"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Gaurav Suresh Malik"}]
dependencies = [
    "flask>=3.0.0",
    "hypercorn>=0.16.0",
    "pydantic>=2.6.0",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "ruamel.yaml>=0.18.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
