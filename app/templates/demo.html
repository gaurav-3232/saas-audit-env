<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SaaSAuditEnv - Interactive Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        min-height: 100vh;
      }
      .header {
        background: #1e293b;
        border-bottom: 1px solid #334155;
        padding: 1rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .header h1 {
        font-size: 1.4rem;
        color: #38bdf8;
      }
      .header a {
        color: #94a3b8;
        text-decoration: none;
        font-size: 0.9rem;
      }
      .header a:hover {
        color: #38bdf8;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 1.5rem;
      }
      .task-select {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1rem;
        margin-bottom: 1.5rem;
      }
      .task-card {
        background: #1e293b;
        border: 2px solid #334155;
        border-radius: 0.75rem;
        padding: 1.2rem;
        cursor: pointer;
        transition: all 0.2s;
      }
      .task-card:hover {
        border-color: #38bdf8;
        transform: translateY(-2px);
      }
      .task-card.active {
        border-color: #059669;
        background: #0f291e;
      }
      .task-card h3 {
        font-size: 1rem;
        margin-bottom: 0.3rem;
        color: #f1f5f9;
      }
      .task-card .diff {
        font-size: 0.75rem;
        font-weight: 700;
        padding: 0.1rem 0.4rem;
        border-radius: 0.2rem;
        display: inline-block;
        margin-bottom: 0.5rem;
      }
      .easy {
        background: #065f46;
        color: #6ee7b7;
      }
      .medium {
        background: #713f12;
        color: #fcd34d;
      }
      .hard {
        background: #7f1d1d;
        color: #fca5a5;
      }
      .medium-hard {
        background: #7c2d12;
        color: #fdba74;
      }
      .expert {
        background: #581c87;
        color: #d8b4fe;
      }
      .task-card .meta {
        font-size: 0.8rem;
        color: #94a3b8;
        line-height: 1.6;
      }
      .dashboard {
        display: none;
        gap: 1.5rem;
      }
      .dashboard.visible {
        display: grid;
        grid-template-columns: 1fr 340px;
      }
      .stats {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
      }
      .stat {
        background: #1e293b;
        border-radius: 0.5rem;
        padding: 0.8rem 1.2rem;
        flex: 1;
        min-width: 140px;
      }
      .stat .label {
        font-size: 0.7rem;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .stat .value {
        font-size: 1.3rem;
        font-weight: 700;
        margin-top: 0.2rem;
      }
      .stat .value.green {
        color: #4ade80;
      }
      .stat .value.red {
        color: #f87171;
      }
      .stat .value.blue {
        color: #38bdf8;
      }
      .stat .value.yellow {
        color: #facc15;
      }
      .progress-wrap {
        background: #334155;
        border-radius: 1rem;
        height: 8px;
        margin-bottom: 1.5rem;
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #059669, #4ade80);
        border-radius: 1rem;
        transition: width 0.5s ease;
      }
      .subs-panel {
        background: #1e293b;
        border-radius: 0.75rem;
        padding: 1rem;
        overflow-x: auto;
      }
      .subs-panel h2 {
        font-size: 1rem;
        color: #7dd3fc;
        margin-bottom: 0.8rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.82rem;
      }
      th {
        color: #64748b;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.7rem;
        padding: 0.5rem;
        text-align: left;
        border-bottom: 1px solid #334155;
      }
      td {
        padding: 0.5rem;
        border-bottom: 1px solid #1e293b;
        vertical-align: middle;
      }
      tr:hover {
        background: #0f172a;
      }
      .crit-badge {
        font-size: 0.7rem;
        padding: 0.1rem 0.4rem;
        border-radius: 0.2rem;
        font-weight: 600;
      }
      .crit-critical {
        background: #7f1d1d;
        color: #fca5a5;
      }
      .crit-high {
        background: #7c2d12;
        color: #fdba74;
      }
      .crit-medium {
        background: #713f12;
        color: #fcd34d;
      }
      .crit-low {
        background: #065f46;
        color: #6ee7b7;
      }
      .waste-bar {
        width: 60px;
        height: 6px;
        background: #334155;
        border-radius: 3px;
        display: inline-block;
        vertical-align: middle;
        margin-left: 4px;
      }
      .waste-fill {
        height: 100%;
        border-radius: 3px;
        background: #f87171;
      }
      .action-panel {
        background: #1e293b;
        border-radius: 0.75rem;
        padding: 1.2rem;
      }
      .action-panel h2 {
        font-size: 1rem;
        color: #7dd3fc;
        margin-bottom: 1rem;
      }
      .action-group {
        margin-bottom: 1rem;
      }
      .action-group label {
        font-size: 0.75rem;
        color: #94a3b8;
        display: block;
        margin-bottom: 0.3rem;
      }
      select,
      input[type="number"],
      textarea {
        width: 100%;
        background: #0f172a;
        border: 1px solid #334155;
        color: #e2e8f0;
        padding: 0.5rem;
        border-radius: 0.4rem;
        font-size: 0.85rem;
        margin-bottom: 0.5rem;
      }
      select:focus,
      input:focus,
      textarea:focus {
        outline: none;
        border-color: #38bdf8;
      }
      textarea {
        resize: vertical;
        min-height: 60px;
      }
      .btn {
        padding: 0.6rem 1.2rem;
        border: none;
        border-radius: 0.5rem;
        font-weight: 600;
        font-size: 0.85rem;
        cursor: pointer;
        width: 100%;
        transition: all 0.2s;
      }
      .btn-primary {
        background: #2563eb;
        color: white;
      }
      .btn-primary:hover {
        background: #1d4ed8;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .log {
        margin-top: 1rem;
        max-height: 300px;
        overflow-y: auto;
      }
      .log-entry {
        font-size: 0.78rem;
        padding: 0.4rem 0;
        border-bottom: 1px solid #1e293b;
        line-height: 1.4;
      }
      .log-entry .ok {
        color: #4ade80;
      }
      .log-entry .err {
        color: #f87171;
      }
      .log-entry .reward {
        color: #facc15;
        font-weight: 600;
      }
      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 100;
        align-items: center;
        justify-content: center;
      }
      .modal-overlay.visible {
        display: flex;
      }
      .modal {
        background: #1e293b;
        border-radius: 1rem;
        padding: 2rem;
        max-width: 500px;
        width: 90%;
        text-align: center;
      }
      .modal .sc {
        font-size: 3.5rem;
        font-weight: 800;
        margin: 1rem 0;
      }
      .modal .sc.high {
        color: #4ade80;
      }
      .modal .sc.mid {
        color: #facc15;
      }
      .modal .sc.low {
        color: #f87171;
      }
      .modal .details {
        text-align: left;
        font-size: 0.85rem;
        color: #94a3b8;
        margin: 1rem 0;
        line-height: 1.8;
      }
      .modal .btn {
        margin-top: 1rem;
        width: auto;
        display: inline-block;
        padding: 0.6rem 2rem;
      }
      @media (max-width: 900px) {
        .dashboard.visible {
          grid-template-columns: 1fr;
        }
        .action-panel {
          order: -1;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>SaaSAuditEnv - Interactive Demo</h1>
      <a href="/">Back to API Docs</a>
    </div>
    <div class="container">
      <div id="taskSel">
        <h2 style="margin-bottom: 1rem; color: #94a3b8; font-size: 0.9rem">
          Choose a task to begin auditing:
        </h2>
        <div class="task-select" id="taskCards">
          <div style="color: #64748b; padding: 2rem; text-align: center">
            Loading tasks...
          </div>
        </div>
        <button
          class="btn btn-primary"
          id="startBtn"
          disabled
          style="max-width: 300px; margin-top: 0.5rem"
        >
          Select a task to start
        </button>
      </div>
      <div class="dashboard" id="dashboard">
        <div>
          <div class="stats" id="statsBar"></div>
          <div class="progress-wrap">
            <div class="progress-bar" id="progressBar"></div>
          </div>
          <div class="subs-panel">
            <h2>Subscriptions</h2>
            <table>
              <thead>
                <tr>
                  <th>Tool</th>
                  <th>Dept</th>
                  <th>Plan</th>
                  <th>Seats</th>
                  <th>Active</th>
                  <th>Waste</th>
                  <th>Cost/mo</th>
                  <th>Criticality</th>
                </tr>
              </thead>
              <tbody id="subsTable"></tbody>
            </table>
          </div>
        </div>
        <div class="action-panel">
          <h2>Take Action</h2>
          <div class="action-group">
            <label>Action Type</label>
            <select id="actionType" onchange="updateFields()">
              <option value="inspect_tool">Inspect Tool</option>
              <option value="reduce_seats">Reduce Seats</option>
              <option value="downgrade_plan">Downgrade Plan</option>
              <option value="cancel_subscription">Cancel Subscription</option>
              <option value="merge_tools">Merge Tools</option>
              <option value="submit_recommendation">
                Submit Recommendation
              </option>
            </select>
          </div>
          <div id="actionFields"></div>
          <button class="btn btn-primary" id="exBtn" onclick="doAction()">
            Execute Action
          </button>
          <div class="log" id="aLog">
            <h3
              style="
                font-size: 0.85rem;
                color: #64748b;
                margin: 0.8rem 0 0.5rem;
              "
            >
              Action Log
            </h3>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-overlay" id="sModal">
      <div class="modal">
        <h2 style="color: #7dd3fc">Episode Complete!</h2>
        <div class="sc" id="fScore">0.0</div>
        <div class="details" id="sDets"></div>
        <button class="btn btn-primary" onclick="resetAll()">Play Again</button>
      </div>
    </div>
    <script>
      var B = window.location.origin,
        obs = null,
        done = false;
      function loadTasks() {
        fetch(B + "/tasks")
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            var c = document.getElementById("taskCards");
            c.innerHTML = "";
            var t = d.tasks;
            for (var i = 0; i < t.length; i++) {
              (function (tk) {
                var el = document.createElement("div");
                el.className = "task-card";
                el.innerHTML =
                  '<span class="diff ' +
                  tk.difficulty +
                  '">' +
                  tk.difficulty +
                  "</span><h3>" +
                  tk.task_id +
                  "</h3>" +
                  '<div class="meta">' +
                  tk.num_subscriptions +
                  " tools &middot; $" +
                  Math.round(tk.total_monthly_spend).toLocaleString() +
                  "/mo<br>Target: $" +
                  Math.round(tk.target_savings).toLocaleString() +
                  "/mo &middot; " +
                  tk.max_steps +
                  " steps</div>";
                el.onclick = function () {
                  var all = document.querySelectorAll(".task-card");
                  for (var j = 0; j < all.length; j++)
                    all[j].classList.remove("active");
                  el.classList.add("active");
                  var b = document.getElementById("startBtn");
                  b.disabled = false;
                  b.textContent = "Start " + tk.task_id;
                  b.onclick = function () {
                    startEp(tk.task_id);
                  };
                };
                c.appendChild(el);
              })(t[i]);
            }
          });
      }
      function startEp(tid) {
        fetch(B + "/reset", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ task_id: tid }),
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            obs = d.observation;
            done = false;
            document.getElementById("taskSel").style.display = "none";
            document.getElementById("dashboard").classList.add("visible");
            document.getElementById("aLog").innerHTML =
              '<h3 style="font-size:0.85rem;color:#64748b;margin:0.8rem 0 0.5rem">Action Log</h3>';
            render();
            updateFields();
          });
      }
      function render() {
        if (!obs) return;
        var o = obs,
          p =
            o.target_savings > 0
              ? Math.min(100, (o.savings_achieved / o.target_savings) * 100)
              : 0;
        document.getElementById("statsBar").innerHTML =
          '<div class="stat"><div class="label">Current Spend</div><div class="value blue">$' +
          Math.round(o.current_monthly_spend).toLocaleString() +
          '</div></div><div class="stat"><div class="label">Savings</div><div class="value green">$' +
          Math.round(o.savings_achieved).toLocaleString() +
          '</div></div><div class="stat"><div class="label">Target</div><div class="value yellow">$' +
          Math.round(o.target_savings).toLocaleString() +
          '</div></div><div class="stat"><div class="label">Step</div><div class="value">' +
          o.current_step +
          "/" +
          o.max_steps +
          "</div></div>";
        document.getElementById("progressBar").style.width = p + "%";
        var tb = document.getElementById("subsTable");
        tb.innerHTML = "";
        for (var i = 0; i < o.subscriptions.length; i++) {
          var s = o.subscriptions[i],
            wp =
              s.seats_purchased > 0
                ? (s.wasted_seats / s.seats_purchased) * 100
                : 0,
            tr = document.createElement("tr");
          tr.innerHTML =
            "<td><strong>" +
            s.name +
            "</strong><br><span style='color:#64748b;font-size:0.7rem'>" +
            s.tool_id +
            "</span></td><td>" +
            s.department +
            "</td><td>" +
            s.plan +
            "</td><td>" +
            s.seats_purchased +
            "</td><td>" +
            s.active_users +
            "</td><td>" +
            s.wasted_seats +
            ' <div class="waste-bar"><div class="waste-fill" style="width:' +
            wp +
            '%"></div></div></td><td>$' +
            Math.round(s.monthly_cost).toLocaleString() +
            "</td><td><span class='crit-badge crit-" +
            s.criticality +
            "'>" +
            s.criticality +
            "</span></td>";
          tb.appendChild(tr);
        }
      }
      function toolOpts() {
        if (!obs) return "";
        var h = "";
        for (var i = 0; i < obs.subscriptions.length; i++) {
          var s = obs.subscriptions[i];
          h +=
            '<option value="' +
            s.tool_id +
            '">' +
            s.name +
            " (" +
            s.tool_id +
            ")</option>";
        }
        return h;
      }
      function updateFields() {
        var t = document.getElementById("actionType").value,
          c = document.getElementById("actionFields"),
          o = toolOpts(),
          pl =
            '<option value="free">free</option><option value="starter">starter</option><option value="basic">basic</option><option value="professional">professional</option><option value="business">business</option><option value="enterprise">enterprise</option>';
        if (t === "inspect_tool")
          c.innerHTML =
            '<div class="action-group"><label>Tool</label><select id="ft">' +
            o +
            "</select></div>";
        else if (t === "reduce_seats")
          c.innerHTML =
            '<div class="action-group"><label>Tool</label><select id="ft">' +
            o +
            '</select></div><div class="action-group"><label>New Seat Count</label><input type="number" id="fn" min="1" value="1"></div>';
        else if (t === "downgrade_plan")
          c.innerHTML =
            '<div class="action-group"><label>Tool</label><select id="ft">' +
            o +
            '</select></div><div class="action-group"><label>Target Plan</label><select id="fp">' +
            pl +
            "</select></div>";
        else if (t === "cancel_subscription")
          c.innerHTML =
            '<div class="action-group"><label>Tool</label><select id="ft">' +
            o +
            '</select></div><div class="action-group"><label>Reason (min 10 chars)</label><textarea id="fr" placeholder="Why cancel?"></textarea></div>';
        else if (t === "merge_tools")
          c.innerHTML =
            '<div class="action-group"><label>Keep Tool</label><select id="fk">' +
            o +
            '</select></div><div class="action-group"><label>Cancel Tool</label><select id="fc">' +
            o +
            '</select></div><div class="action-group"><label>Reason (min 10 chars)</label><textarea id="fr" placeholder="Why merge?"></textarea></div>';
        else if (t === "submit_recommendation")
          c.innerHTML =
            '<div class="action-group"><label>Executive Summary (min 30 chars)</label><textarea id="fs" placeholder="Summary of audit findings"></textarea></div><div class="action-group"><label>Estimated Savings</label><input type="number" id="fe" step="0.01" value="' +
            (obs ? obs.savings_achieved.toFixed(2) : "0") +
            '"></div>';
      }
      function gv(id) {
        var e = document.getElementById(id);
        return e ? e.value : "";
      }
      function doAction() {
        if (done) return;
        var t = document.getElementById("actionType").value,
          a = { action_type: t };
        if (t === "inspect_tool") a.tool_id = gv("ft");
        else if (t === "reduce_seats") {
          a.tool_id = gv("ft");
          a.new_seat_count = parseInt(gv("fn")) || 1;
        } else if (t === "downgrade_plan") {
          a.tool_id = gv("ft");
          a.target_plan = gv("fp");
        } else if (t === "cancel_subscription") {
          a.tool_id = gv("ft");
          a.reason = gv("fr") || "Cancelling unused tool";
        } else if (t === "merge_tools") {
          a.keep_tool_id = gv("fk");
          a.cancel_tool_id = gv("fc");
          a.reason = gv("fr") || "Consolidating overlapping tools";
        } else if (t === "submit_recommendation") {
          a.recommendations = [];
          a.total_estimated_savings = parseFloat(gv("fe")) || 0;
          a.executive_summary =
            gv("fs") || "Audit complete with cost optimizations applied.";
        }
        var btn = document.getElementById("exBtn");
        btn.disabled = true;
        btn.textContent = "Processing...";
        fetch(B + "/step", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: a }),
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            if (d.error) {
              addLog(0, t, d.error, 0);
              btn.disabled = false;
              btn.textContent = "Execute Action";
              return;
            }
            obs = d.observation;
            var rw = d.reward,
              info = d.info || {},
              ok = info.success !== false,
              msg = info.message || "";
            addLog(ok ? 1 : 0, t, msg, rw);
            render();
            updateFields();
            if (d.done) {
              done = true;
              btn.disabled = true;
              btn.textContent = "Episode Complete";
              if (info.episode_result) showSc(info.episode_result);
            } else {
              btn.disabled = false;
              btn.textContent = "Execute Action";
            }
          })
          .catch(function (e) {
            addLog(0, t, "Error: " + e.message, 0);
            btn.disabled = false;
            btn.textContent = "Execute Action";
          });
      }
      function addLog(ok, at, msg, rw) {
        var lg = document.getElementById("aLog"),
          en = document.createElement("div");
        en.className = "log-entry";
        var rs = rw >= 0 ? "+" + rw.toFixed(3) : rw.toFixed(3);
        en.innerHTML =
          '<span class="' +
          (ok ? "ok" : "err") +
          '">' +
          (ok ? "OK" : "FAIL") +
          "</span> <strong>" +
          at +
          '</strong> <span class="reward">' +
          rs +
          "</span><br><span style='color:#94a3b8'>" +
          msg.substring(0, 120) +
          "</span>";
        lg.appendChild(en);
        lg.scrollTop = lg.scrollHeight;
      }
      function showSc(r) {
        var el = document.getElementById("fScore"),
          sc = r.score || 0;
        el.textContent = (sc * 100).toFixed(1) + "%";
        el.className = "sc " + (sc >= 0.8 ? "high" : sc >= 0.5 ? "mid" : "low");
        document.getElementById("sDets").innerHTML =
          "<strong>Task:</strong> " +
          r.task_id +
          "<br><strong>Savings:</strong> $" +
          (r.savings_achieved || 0).toFixed(2) +
          " / $" +
          (r.target_savings || 0).toFixed(2) +
          " target<br><strong>Steps:</strong> " +
          r.steps_taken +
          "<br><strong>Critical tools preserved:</strong> " +
          (r.critical_tools_preserved ? "Yes" : "No") +
          "<br><strong>Invalid actions:</strong> " +
          r.invalid_actions +
          "<br><strong>Total reward:</strong> " +
          (r.total_reward || 0).toFixed(3);
        document.getElementById("sModal").classList.add("visible");
      }
      function resetAll() {
        document.getElementById("sModal").classList.remove("visible");
        document.getElementById("dashboard").classList.remove("visible");
        document.getElementById("taskSel").style.display = "block";
        var c = document.querySelectorAll(".task-card");
        for (var i = 0; i < c.length; i++) c[i].classList.remove("active");
        document.getElementById("startBtn").disabled = true;
        document.getElementById("startBtn").textContent =
          "Select a task to start";
        document.getElementById("exBtn").disabled = false;
        document.getElementById("exBtn").textContent = "Execute Action";
        obs = null;
        done = false;
      }
      loadTasks();
    </script>
  </body>
</html>
