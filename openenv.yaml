name: SaaSAuditEnv
version: "1.0.0"
description: >
  An AI agent environment where the agent audits a company's SaaS subscriptions
  and makes cost-saving decisions without breaking business-critical operations.

author: Gaurav Suresh Malik
license: MIT

environment:
  type: http
  base_url: http://localhost:7860
  endpoints:
    health:
      method: GET
      path: /health
    reset:
      method: POST
      path: /reset
      body_schema:
        task_id: string
    step:
      method: POST
      path: /step
      body_schema:
        action: object
    state:
      method: GET
      path: /state
    tasks:
      method: GET
      path: /tasks

tasks:
  - id: task_easy
    difficulty: easy
    max_steps: 15
    target_savings_usd: 400.00
    description: >
      Obvious inactive seats and one redundant tool. Identify and right-size
      wasteful subscriptions.

  - id: task_medium
    difficulty: medium
    max_steps: 18
    target_savings_usd: 900.00
    description: >
      Duplicate project management tools, seat waste, and a safe optional
      cancellation. Consolidate overlapping tools.

  - id: task_hard
    difficulty: hard
    max_steps: 25
    target_savings_usd: 2500.00
    description: >
      Large mixed portfolio with critical tools, multiple overlapping tool groups,
      over-provisioned seats, and imminent renewals.

  - id: task_startup
    difficulty: medium-hard
    max_steps: 20
    target_savings_usd: 1200.00
    description: >
      Fast-growing startup that adopted expensive enterprise plans too early.
      Requires plan downgrades, seat right-sizing, and consolidation of
      duplicate analytics and docs tools.

  - id: task_merger
    difficulty: expert
    max_steps: 30
    target_savings_usd: 4000.00
    description: >
      Post-acquisition merger with duplicate tool stacks in every department.
      Seven overlap groups require strategic consolidation while preserving
      critical infrastructure. Tests large-scale decision-making.

actions:
  - name: inspect_tool
    required_fields: [tool_id]
    description: Retrieve detailed information about a specific subscription.

  - name: reduce_seats
    required_fields: [tool_id, new_seat_count]
    description: Reduce seats to new_seat_count (must be >= active_users).

  - name: downgrade_plan
    required_fields: [tool_id, target_plan]
    description: Downgrade to a lower plan tier (LOW/MEDIUM criticality only).

  - name: cancel_subscription
    required_fields: [tool_id, reason]
    description: Cancel a subscription entirely (avoid CRITICAL/HIGH tools).

  - name: merge_tools
    required_fields: [keep_tool_id, cancel_tool_id, reason]
    description: Consolidate overlapping tools by keeping one and cancelling the other.

  - name: submit_recommendation
    required_fields:
      [recommendations, total_estimated_savings, executive_summary]
    description: Submit the final audit report. Ends the episode.

grading:
  method: deterministic
  score_range: [0.0, 1.0]
  components:
    - savings_achieved
    - critical_tools_preserved
    - overlap_consolidation
    - seat_right_sizing
    - submission_accuracy

reward_shaping:
  positive:
    - first_time_inspection: +0.02
    - seat_reduction: +0.10 to +0.60 (proportional to savings)
    - plan_downgrade: +0.10 to +0.50
    - safe_cancellation: +0.15 to +0.65
    - valid_merge: +0.08 to +0.65
    - target_met_submission: +0.25
  negative:
    - invalid_action: -0.05
    - reduce_below_active_users: -0.10
    - downgrade_critical_tool: -0.15
    - cancel_high_criticality: -0.15 to -0.20
    - cancel_critical_tool: -0.20 to -0.30
    - double_submission: -0.05

runtime:
  server: hypercorn
  framework: flask
  python: ">=3.11"
  port: 7860

inference:
  script: inference.py
  llm_client: openai
  env_vars:
    - OPENAI_API_KEY
    - API_BASE_URL
    - MODEL_NAME
    - HF_TOKEN
